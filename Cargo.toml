[workspace]
resolver = "3"
members = [
    "crates/itson-protocol",
    "crates/itson-domain",
    "crates/itson-voice",
    "crates/itson-server",
    "crates/itson-client-core",
    "spikes/voice-quic",
    "spikes/gui-common",
    "spikes/gui-iced",
    "spikes/gui-egui",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
publish = false
license = "AGPL-3.0-only"
repository = "https://github.com/pixelsandpistons/itson"

[workspace.dependencies]
itson-protocol = { path = "crates/itson-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
itson-voice = { path = "crates/itson-voice" }
itson-domain = { path = "crates/itson-domain" }
gui-common = { path = "spikes/gui-common" }
# Phase 0 spike crates.
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
opus = "=0.4.0"
cpal = "=0.18.2"
iced = { version = "=0.14.0", features = ["image"] }
eframe = "=0.37.0"
# Already in the approved crates' dependency tree; used directly by the voice spike.
bytes = "=1.12.1"
ring = "=0.17.14"
rusqlite = { version = "=0.41.0", features = ["bundled"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
